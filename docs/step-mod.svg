<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs>
  <rect width="900" height="300" rx="16" fill="#0E1014"/>
  <!-- steam library mock -->
  <text x="40" y="40" fill="#8C93A1" font-size="13">In Steam: your Library</text>
  <rect x="40" y="56" width="250" height="40" rx="8" fill="#222632" stroke="#262A34"/>
  <text x="58" y="81" fill="#E7E9EE" font-size="14">Geometry Dash</text>
  <text x="200" y="81" fill="#8C93A1" font-size="12">right-click</text>
  <rect x="150" y="104" width="190" height="120" rx="8" fill="#171A21" stroke="#262A34"/>
  <text x="168" y="130" fill="#8C93A1" font-size="13">Play</text>
  <rect x="158" y="142" width="174" height="28" rx="6" fill="#2C3140"/>
  <text x="168" y="161" fill="#E7E9EE" font-size="13">Manage  ›</text>
  <text x="168" y="196" fill="#8C93A1" font-size="13">Properties…</text>
  <rect x="346" y="142" width="200" height="66" rx="8" fill="#171A21" stroke="#262A34"/>
  <rect x="354" y="150" width="184" height="26" rx="6" fill="#6E8BFF"/>
  <text x="366" y="168" fill="#FFFFFF" font-size="13" font-weight="600">Browse local files</text>
  <text x="366" y="198" fill="#8C93A1" font-size="13">Uninstall</text>
  <!-- folder -->
  <path d="M550,160 C590,160 590,120 630,120" fill="none" stroke="#FFB800" stroke-width="2" marker-end="url(#a)"/>
  <rect x="636" y="56" width="240" height="190" rx="12" fill="#171A21" stroke="#262A34"/>
  <text x="652" y="82" fill="#8C93A1" font-size="12">Geometry Dash  ›  geode  ›  mods</text>
  <line x1="636" y1="94" x2="876" y2="94" stroke="#262A34"/>
  <rect x="652" y="108" width="208" height="34" rx="6" fill="#222632" stroke="#34C77B"/>
  <rect x="662" y="116" width="18" height="18" rx="3" fill="#6E8BFF"/>
  <text x="688" y="130" fill="#E7E9EE" font-size="12">nil.gd-call-muter-link.geode</text>
  <text x="652" y="170" fill="#8C93A1" font-size="12">Drop the .geode file in here,</text>
  <text x="652" y="188" fill="#8C93A1" font-size="12">then start Geometry Dash.</text>
  <text x="652" y="222" fill="#34C77B" font-size="12">Check: Geode → Installed mods</text>
  <text x="40" y="270" fill="#8C93A1" font-size="12">No "geode" folder? Install Geode v6 first (geode-sdk.org). Mac: Steam → Manage → Browse local files works the same way.</text>
</svg>
