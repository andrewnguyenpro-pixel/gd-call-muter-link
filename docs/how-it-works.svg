<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C93A1"/></marker>
  </defs>
  <rect width="900" height="300" rx="16" fill="#0E1014"/>
  <!-- game -->
  <rect x="24" y="100" width="200" height="100" rx="14" fill="#171A21" stroke="#262A34"/>
  <text x="124" y="138" fill="#E7E9EE" font-size="16" font-weight="600" text-anchor="middle">Geometry Dash</text>
  <text x="124" y="160" fill="#8C93A1" font-size="13" text-anchor="middle">+ GD Call Muter Link</text>
  <text x="124" y="178" fill="#8C93A1" font-size="13" text-anchor="middle">(Geode mod)</text>
  <!-- app -->
  <rect x="330" y="100" width="200" height="100" rx="14" fill="#171A21" stroke="#6E8BFF" stroke-width="2"/>
  <text x="430" y="140" fill="#E7E9EE" font-size="16" font-weight="600" text-anchor="middle">GD Call Muter</text>
  <text x="430" y="162" fill="#8C93A1" font-size="13" text-anchor="middle">the app (Windows / Mac)</text>
  <text x="430" y="180" fill="#6E8BFF" font-size="13" text-anchor="middle">checks your % 100× a second</text>
  <line x1="226" y1="150" x2="326" y2="150" stroke="#8C93A1" stroke-width="2" marker-end="url(#a)"/>
  <text x="276" y="140" fill="#8C93A1" font-size="12" text-anchor="middle">exact %</text>
  <!-- extension -->
  <rect x="626" y="40" width="256" height="64" rx="12" fill="#171A21" stroke="#262A34"/>
  <text x="754" y="66" fill="#E7E9EE" font-size="14" font-weight="600" text-anchor="middle">Browser extension</text>
  <text x="754" y="86" fill="#8C93A1" font-size="12" text-anchor="middle">mutes Instagram tab, deafens discord.com</text>
  <rect x="626" y="196" width="256" height="64" rx="12" fill="#171A21" stroke="#262A34"/>
  <text x="754" y="222" fill="#E7E9EE" font-size="14" font-weight="600" text-anchor="middle">Discord app</text>
  <text x="754" y="242" fill="#8C93A1" font-size="12" text-anchor="middle">app presses your Toggle Deafen key</text>
  <path d="M532,130 C576,130 584,72 622,72" fill="none" stroke="#8C93A1" stroke-width="2" marker-end="url(#a)"/>
  <path d="M532,170 C576,170 584,228 622,228" fill="none" stroke="#8C93A1" stroke-width="2" marker-end="url(#a)"/>
  <text x="588" y="155" fill="#34C77B" font-size="12" text-anchor="middle">past your %</text>
  <text x="450" y="30" fill="#E7E9EE" font-size="18" font-weight="700" text-anchor="middle">How it works</text>
  <text x="450" y="284" fill="#8C93A1" font-size="12" text-anchor="middle">Everything stays on your computer (127.0.0.1). Nothing is sent online.</text>
</svg>
