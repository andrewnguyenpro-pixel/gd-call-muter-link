<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <rect width="900" height="320" rx="16" fill="#0E1014"/>
  <!-- browser window -->
  <rect x="30" y="24" width="840" height="270" rx="12" fill="#171A21" stroke="#262A34"/>
  <circle cx="52" cy="46" r="6" fill="#F06464"/><circle cx="72" cy="46" r="6" fill="#FFB800"/><circle cx="92" cy="46" r="6" fill="#34C77B"/>
  <rect x="120" y="34" width="420" height="26" rx="13" fill="#222632"/>
  <text x="138" y="52" fill="#E7E9EE" font-size="13">chrome://extensions</text>
  <circle cx="122" cy="47" r="12" fill="#FFB800"/><text x="122" y="52" fill="#0E1014" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <line x1="30" y1="72" x2="870" y2="72" stroke="#262A34"/>
  <text x="54" y="104" fill="#E7E9EE" font-size="18" font-weight="600">Extensions</text>
  <!-- developer mode -->
  <text x="664" y="104" fill="#E7E9EE" font-size="13">Developer mode</text>
  <rect x="780" y="88" width="44" height="24" rx="12" fill="#34C77B"/><circle cx="812" cy="100" r="9" fill="#fff"/>
  <circle cx="846" cy="100" r="12" fill="#FFB800"/><text x="846" y="105" fill="#0E1014" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <line x1="30" y1="124" x2="870" y2="124" stroke="#262A34"/>
  <!-- load unpacked -->
  <rect x="54" y="138" width="130" height="32" rx="8" fill="#222632" stroke="#6E8BFF" stroke-width="2"/>
  <text x="119" y="159" fill="#E7E9EE" font-size="13" text-anchor="middle">Load unpacked</text>
  <circle cx="198" cy="154" r="12" fill="#FFB800"/><text x="198" y="159" fill="#0E1014" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <rect x="216" y="138" width="90" height="32" rx="8" fill="#222632"/><text x="261" y="159" fill="#8C93A1" font-size="13" text-anchor="middle">Pack</text>
  <!-- picker -->
  <rect x="380" y="150" width="300" height="118" rx="10" fill="#0E1014" stroke="#262A34"/>
  <text x="396" y="174" fill="#8C93A1" font-size="12">Pick the folder from the zip:</text>
  <rect x="396" y="186" width="268" height="30" rx="6" fill="#6E8BFF"/>
  <text x="410" y="206" fill="#fff" font-size="13" font-weight="600">Browser extension</text>
  <text x="396" y="240" fill="#8C93A1" font-size="12">Then click "Select Folder".</text>
  <circle cx="696" cy="201" r="12" fill="#FFB800"/><text x="696" y="206" fill="#0E1014" font-size="13" font-weight="700" text-anchor="middle">4</text>
  <!-- result card -->
  <rect x="54" y="190" width="300" height="78" rx="10" fill="#222632" stroke="#262A34"/>
  <text x="70" y="216" fill="#E7E9EE" font-size="14" font-weight="600">GD Call Muter - Browser</text>
  <text x="70" y="236" fill="#8C93A1" font-size="12">version 3.0</text>
  <rect x="300" y="244" width="40" height="18" rx="9" fill="#6E8BFF"/><circle cx="330" cy="253" r="7" fill="#fff"/>
  <text x="450" y="312" fill="#8C93A1" font-size="12" text-anchor="middle">5. Refresh your instagram.com and discord.com tabs. Keep the folder; Chrome loads it from there. (Opera, Edge, Brave: same steps.)</text>
</svg>
