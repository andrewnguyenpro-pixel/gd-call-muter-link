name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    name: Windows
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload .geode file
        uses: actions/upload-artifact@v4
        with:
          name: gd-auto-deafen
          path: ${{ steps.build.outputs.build-output }}
