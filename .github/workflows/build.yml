name: Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  mod:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    name: Mod (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true

  mac-app:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GD Call Muter.app
        run: ./mac-app/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: mac-app/build/GD-Call-Muter-Mac.zip

  windows-app:
    name: Windows app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build GDCallMuter.exe
        working-directory: windows-app
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w" -o GDCallMuter.exe .
      - name: Zip with the browser extension
        run: |
          mkdir -p "pkg/GD Call Muter (Windows)"
          cp windows-app/GDCallMuter.exe "pkg/GD Call Muter (Windows)/"
          cp -R extension "pkg/GD Call Muter (Windows)/Browser extension"
          (cd pkg && zip -qr ../GD-Call-Muter-Windows.zip "GD Call Muter (Windows)")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            windows-app/GDCallMuter.exe
            GD-Call-Muter-Windows.zip

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: ["mod", "mac-app", "windows-app"]
    steps:
      - name: Combine Windows + Mac mod builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - uses: actions/upload-artifact@v4
        with:
          name: gd-call-muter-link
          path: ${{ steps.combine.outputs.build-output }}
      - uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: mac-app-out
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: windows-app-out
      - name: Save builds to the "builds" branch
        run: |
          mkdir -p out
          find "${{ steps.combine.outputs.build-output }}" -name "*.geode" -exec cp {} out/ \;
          cp mac-app-out/*.zip out/
          find windows-app-out -name "*.exe" -exec cp {} out/ \;
          find windows-app-out -name "*.zip" -exec cp {} out/ \;
          ls -la out
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create latest out/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "GD Call Muter (latest build)" \
            --notes "Windows: GDCallMuter.exe (or the Windows zip, which also has the browser extension). Mac: GD-Call-Muter-Mac.zip. Geode mod: nil.gd-call-muter-link.geode (Windows + Mac, GD 2.2091, Geode 6)."
